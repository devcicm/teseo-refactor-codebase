name: Verify Teseo skill (no automatic repository writes)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests and integrity
        run: |
          python -m unittest discover -s tests -v
          python crear_skill_refactor_v2.5.py --check
          python crear_skill_refactor_v2.5.py
          cd dist/refactor-codebase && sha256sum -c MANIFEST.sha256
